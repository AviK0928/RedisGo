name: ci

on:
    push:
          branches: ["**"]
            pull_request:

              jobs:
                  test:
                        runs-on: ubuntu-latest
                            steps:
                                    - uses: actions/checkout@v4

                                            - uses: actions/setup-go@v5
                                                      with:
                                                                  go-version: "1.22"
                                                                            cache: true

                                                                                  - name: Check formatting
                                                                                            run: test -z "$(gofmt -l .)"

                                                                                                  - name: Vet
                                                                                                            run: go vet ./...

                                                                                                                  - name: Test with race detector
                                                                                                                            run: go test -race -count=1 ./...

                                                                                                                                  - name: Build
                                                                                                                                            run: go build -o /tmp/server ./cmd/server

                                                                                                                                                  - name: Smoke test the HTTP surface
                                                                                                                                                            run: |
                                                                                                                                                                        PORT=8080 /tmp/server &
                                                                                                                                                                                  SERVER_PID=$!
                                                                                                                                                                                            sleep 2
                                                                                                                                                                                                      curl -fsS http://localhost:8080/healthz
                                                                                                                                                                                                                echo
                                                                                                                                                                                                                          curl -fsS http://localhost:8080/api/stats
                                                                                                                                                                                                                                    kill $SERVER_PID
