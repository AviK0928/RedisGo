name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /tmp/server ./cmd/server

      - name: Smoke test the HTTP surface
        run: |
          PORT=8080 /tmp/server &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://localhost:8080/healthz
          echo
          curl -fsS http://localhost:8080/api/stats
          kill $SERVER_PID

  bench:
    runs-on: ubuntu-latest
    # Manual only. A full sweep takes around 20 minutes, and the numbers are
    # needed a handful of times across the project rather than every push.
    # Run it from the Actions tab: select this workflow, then Run workflow.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Report the runner hardware
        run: |
          nproc
          lscpu | grep -E "Model name|CPU\(s\)|MHz" || true

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -benchtime=3s -count=10 -cpu=4 \
            ./internal/engine/ | tee bench.txt

      - name: Summarize with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          "$(go env GOPATH)/bin/benchstat" bench.txt | tee benchstat.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            bench.txt
            benchstat.txt
